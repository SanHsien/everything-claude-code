name: Fork maintenance

on:
  push:
    branches: [main]
    paths:
      - FORK.md
      - NOTICE.md
      - REVIEW.md
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - install.ps1
      - install.sh
      - docs/fork/**
      - tools/**
      - requirements-dev.txt
      - .github/workflows/fork-maintenance.yml
      - .github/workflows/upstream-check.yml
      - .github/workflows/*.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fork gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install fork-gate dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical fork gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1

      - name: Canonical fork gate
        if: runner.os != 'Windows'
        run: |
          python -m compileall -q tools
          python -m ruff check --select E9,F tools
          python -m pytest tools -q
          python tools/check_links.py
